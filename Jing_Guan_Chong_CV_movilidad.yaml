        end_date: "present"
        highlights:
          - "Facilitated digital transformation certificate learning for individuals and organizations, covering topics such as Blockchain, Cloud Computing, Artificial Intelligence (AI), Internet of Things (IoT), and Cybersecurity."
          - "Mentored participants to apply emerging technologies to real-world challenges."
          - "Collaborated with top technology universities in the USA."
      - company: "Decathlon International"
        position: "Tech Lead | Automation"
        location: "Madrid, Spain"
        start_date: "2021-01"
        end_date: "2022-04"
        highlights:
          - "Led end-to-end projects in logistics automation and robotics, establishing the technical vision and strategy for digital transformation."
          - "Directed the implementation of advanced automation and robotics systems, including Convoyeur, pocket sorter, Geek+, RFID, and Toyota solutions, optimizing operational efficiency."
          - "Supervised the integration and management of IBM systems, ensuring alignment with strategic objectives and enhancing infrastructure resilience."
          - "Led projects for the expansion of logistics centers in countries such as Colombia, Mexico, Chile, Egypt, Romania, Turkey, and Southern Europe, strengthening the company's global presence."
      - company: "Decathlon International"
        position: "Senior Engineer & Project Manager"
        location: "Madrid, Spain"
        start_date: "2015-01"
        end_date: "2021-01"
        highlights:
          - "Led technical strategies for automation and digital transformation in logistics across Europe and America."
          - "Implemented robotic systems and cloud architectures, ensuring scalability and high availability in international projects."
          - "Supervised the integration and management of IBM systems, ensuring alignment with strategic objectives and enhancing infrastructure resilience."
