          - "Owner of Universal Control Group (UUCG): Enabled global optimization, measurement, and analysis across 9 countries, unlocking a strategic impact of over €3.4M (including €2M in Spain and France)."
          - "Developed predictive models for E-commerce Forecasting Orders, reducing MAPE in Italy from 30% to 10-15% and achieving cost savings of €550k in Spain and €1.1M in Italy."
          - "Drove incremental business value through Product Replenishment and Engagement Score projects, leveraging data-driven insights to overcome external challenges."
          - "Implemented AI and Big Data solutions on cloud platforms such as GCP and AWS."
          - "Led the transformation of the Logistics Domain by integrating analytical intelligence and visualizations to optimize workflows and enable new use cases."
          - "Led CARTO platform adoption, saving €60k in licensing costs and unlocking a potential ROI of €15M."
          - "Enhanced analytics frameworks to drive significant value attribution through data visualization."
